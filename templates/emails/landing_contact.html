<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>New Landing Page Submission</title>
</head>
<body style="margin:0; padding:0; background-color:#f0f0f0; font-family:Arial, Helvetica, sans-serif;">

    <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#ffffff;">

        <!-- Header -->
        <tr>
            <td style="background-color:#8b5cf6; padding:16px 20px;">
                <table width="100%" cellpadding="0" cellspacing="0">
                    <tr>
                        <td style="color:#ffffff; font-size:18px; font-weight:bold;">
                            MARKET&nbsp;Pro
                        </td>
                        <td style="color:#e9d5ff; font-size:12px; text-align:right;">
                            New Landing Page Submission
                        </td>
                    </tr>
                </table>
            </td>
        </tr>

        <!-- Body -->
        <tr>
            <td style="padding:24px; color:#000000; font-size:14px; line-height:1.6;">

                <p style="margin:0 0 16px 0; font-size:15px;">
                    A new submission has been received from the MarketPro landing page.
                </p>

                <!-- Data Table -->
                <table width="100%" cellpadding="0" cellspacing="0"
                    style="border:1px solid #ddd; border-radius:4px; overflow:hidden;">
                    <thead>
                        <tr style="background-color:#f5f3ff;">
                            <th style="padding:10px 14px; text-align:left; font-size:12px; color:#6d28d9; text-transform:uppercase; letter-spacing:0.05em; border-bottom:1px solid #ddd; width:35%;">
                                Field
                            </th>
                            <th style="padding:10px 14px; text-align:left; font-size:12px; color:#6d28d9; text-transform:uppercase; letter-spacing:0.05em; border-bottom:1px solid #ddd;">
                                Value
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for key, value in data.items %}
                        <tr style="border-bottom:1px solid #f3f4f6;">
                            <td style="padding:10px 14px; font-size:13px; color:#6b7280; font-weight:600; vertical-align:top;">
                                {{ key|title }}
                            </td>
                            <td style="padding:10px 14px; font-size:13px; color:#111827; vertical-align:top;">
                                {{ value }}
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>

                <p style="margin:20px 0 0 0; font-size:12px; color:#9ca3af;">
                    Submitted at: {{ submitted_at }}
                </p>

            </td>
        </tr>

        <!-- Footer -->
        <tr>
            <td style="border-top:1px solid #ddd; padding:12px 20px; background-color:#fafafa;">
                <p style="margin:0; font-size:11px; color:#555; text-align:center;">
                    &copy; {{ year }} Market Pro. This is an automated notification.
                </p>
            </td>
        </tr>

    </table>

</body>
</html>
